<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sashiki</title>
<style>
  :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { margin: 2rem auto; max-width: 960px; padding: 0 1rem; }
  h1 { font-size: 1.2rem; } h1 span { opacity: .5; font-weight: normal; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .4rem .8rem; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
  th { opacity: .6; font-weight: normal; }
  .running { color: #2da44e; } .sleeping { color: #bf8700; } .error { color: #cf222e; }
  .meta { opacity: .6; margin-top: 1rem; font-size: .85rem; }
  #branches tbody tr { cursor: pointer; }
  #branches tbody tr:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
  #branches tr.selected { background: color-mix(in srgb, currentColor 10%, transparent); }
  #detail { margin-top: 1.5rem; display: none; }
  #detail h2 { font-size: 1rem; }
  .browser { display: grid; grid-template-columns: 260px 1fr; gap: 1rem; align-items: start; }
  @media (max-width: 700px) { .browser { grid-template-columns: 1fr; } }
  #schema { font-size: .85rem; line-height: 1.5; overflow-x: auto; }
  #schema .db { font-weight: bold; margin-top: .5rem; }
  #schema .tbl { cursor: pointer; padding-left: 1rem; }
  #schema .tbl:hover { text-decoration: underline; }
  #schema .col { padding-left: 2rem; opacity: .65; display: none; }
  #schema .open .col { display: block; }
  #schema .key { color: #bf8700; }
  #sql { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem;
         background: transparent; color: inherit; min-height: 3.2rem;
         border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 6px; }
  #run { font: inherit; padding: .3rem 1rem; margin-top: .4rem; cursor: pointer; }
  #result-wrap { overflow-x: auto; margin-top: .8rem; }
  #result td, #result th { white-space: nowrap; max-width: 24rem; overflow: hidden; text-overflow: ellipsis; }
  #qerr { color: #cf222e; white-space: pre-wrap; }
  #result.raw td { white-space: pre-wrap; max-width: none; overflow: visible; }
  #schema .ddl { opacity: .5; cursor: pointer; font-size: .8em; margin-left: .4rem; }
  #schema .ddl:hover { opacity: 1; text-decoration: underline; }
  .null { opacity: .4; font-style: italic; }
  .stale { color: #bf8700; }
  .baseline-cell { opacity: .75; }
  #auth { display: none; margin: 1rem 0; padding: .8rem; border-radius: 6px;
          border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
  #auth input { font: inherit; padding: .3rem .5rem; width: 28rem; max-width: 100%; box-sizing: border-box; }
  #auth button, #logout { font: inherit; padding: .3rem .8rem; cursor: pointer; }
  #logout { display: none; float: right; font-size: .8rem; }
</style>
<button id="logout" type="button">トークンを消す</button>
<h1>🌿 sashiki <span id="baseline"></span></h1>
<form id="auth">
  <p>この sashikid はトークンが必要です(<code>sashiki token create --name ui --scope admin</code> で発行)。
     トークンはこのブラウザのタブにだけ保存します。</p>
  <input id="token" type="password" autocomplete="off" placeholder="sashiki_...">
  <button type="submit">使う</button>
  <div id="autherr" style="color:#cf222e"></div>
</form>
<table id="branches">
  <thead><tr><th>NAME</th><th>STATE</th><th>PORT</th><th>BASELINE</th><th>LAST_CONN</th><th>USED</th></tr></thead>
  <tbody id="rows"><tr><td colspan="6">loading…</td></tr></tbody>
</table>
<p class="meta">auto-refresh 5s · 行をクリックで中身を見る · <a href="/v1/branches">API</a></p>

<section id="detail">
  <h2>🔍 <span id="dname"></span></h2>
  <div class="browser">
    <div id="schema">loading schema…</div>
    <div>
      <textarea id="sql" spellcheck="false" placeholder="SELECT ..."></textarea><br>
      <button id="run">Run (⌘⏎)</button>
      <div id="qerr"></div>
      <div id="result-wrap"><table id="result"></table></div>
    </div>
  </div>
</section>

<script>
let selected = null;

function human(n) {
  if (n < 1024) return n + "B";
  const u = ["K","M","G","T"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(1) + u[i];
}
function ago(iso) {
  if (!iso) return "-";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
// MySQL 識別子のクォート(予約語・ハイフン入りテーブル名対策)
function qi(s) {
  return "`" + String(s).replace(/`/g, "``") + "`";
}

// snapshot 名の短縮表示(zfs: pool/base@NAME / fsx: ...snapshot/NAME)
function shortSnap(s) {
  if (!s) return "-";
  const at = s.lastIndexOf("@");
  if (at >= 0) return s.slice(at + 1);
  const sl = s.lastIndexOf("/");
  return sl >= 0 ? s.slice(sl + 1) : s;
}

// トークン(#301)。loopback 無認証なら不要。401 が返ったら入力欄を出す。
// sessionStorage に置く(タブを閉じたら消える)。Authorization ヘッダは
// ブラウザが自動では付けないので CSRF にならない。
const TOKEN_KEY = "sashiki.token";
function token() { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }
function setToken(v) { try { v ? sessionStorage.setItem(TOKEN_KEY, v) : sessionStorage.removeItem(TOKEN_KEY); } catch {} }
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token()) headers["Authorization"] = "Bearer " + token();
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    document.getElementById("auth").style.display = "block";
    document.getElementById("autherr").textContent = token() ? "トークンが無効です" : "";
    throw new Error("unauthorized");
  }
  document.getElementById("auth").style.display = "none";
  document.getElementById("logout").style.display = token() ? "block" : "none";
  return res;
}
document.getElementById("auth").addEventListener("submit", e => {
  e.preventDefault();
  setToken(document.getElementById("token").value.trim());
  document.getElementById("token").value = "";
  refresh();
});
document.getElementById("logout").addEventListener("click", () => { setToken(""); location.reload(); });

async function refresh() {
  try {
    const [br, bl] = await Promise.all([
      api("/v1/branches").then(r => r.json()),
      api("/v1/baseline").then(r => r.json()),
    ]);
    document.getElementById("baseline").textContent =
      shortSnap(bl.current) + (bl.refreshing ? " (refreshing…)" : "");
    const rows = br.branches.map(b => {
      const stale = b.origin_snapshot && bl.current && b.origin_snapshot !== bl.current;
      const origin = shortSnap(b.origin_snapshot);
      const cell = stale
        ? `<span class="stale" title="current(${esc(shortSnap(bl.current))})より古い baseline から作成。reset でも古い方に戻ります">⚠ ${esc(origin)}</span>`
        : esc(origin);
      return `<tr data-name="${esc(b.name)}" class="${b.name === selected ? "selected" : ""}">` +
        `<td>${esc(b.name)}</td><td class="${esc(b.state)}">${esc(b.state)}</td>` +
        `<td>${b.port}</td><td class="baseline-cell">${cell}</td>` +
        `<td>${ago(b.last_conn_at)}</td><td>${human(b.used_bytes)}</td></tr>`;
    }).join("");
    document.getElementById("rows").innerHTML =
      rows || '<tr><td colspan="6">no branches — mysql -udev@&lt;name&gt; で生やせます</td></tr>';
  } catch (e) { /* sashikid 再起動中など */ }
}

async function openBranch(name) {
  selected = name;
  document.getElementById("detail").style.display = "block";
  document.getElementById("dname").textContent = name;
  document.getElementById("result").innerHTML = "";
  document.getElementById("qerr").textContent = "";
  const el = document.getElementById("schema");
  el.textContent = "loading schema…";
  refresh();
  try {
    const res = await api(`/v1/branches/${encodeURIComponent(name)}/schema`);
    if (!res.ok) throw new Error((await res.json()).error?.message || res.status);
    const { databases } = await res.json();
    if (!databases.length) { el.textContent = "(ユーザーDBなし)"; return; }
    el.innerHTML = databases.map(d =>
      `<div class="db">${esc(d.name)}</div>` +
      d.tables.map(t =>
        `<div class="tblwrap"><div class="tbl" data-db="${esc(d.name)}" data-tbl="${esc(t.name)}">` +
        `▸ ${esc(t.name)} <span style="opacity:.5">~${t.approx_rows}行</span>` +
        `<span class="ddl" data-db="${esc(d.name)}" data-tbl="${esc(t.name)}">DDL</span></div>` +
        t.columns.map(c =>
          `<div class="col">${c.key === "PRI" ? '<span class="key">🔑</span>' : ""}` +
          `${esc(c.name)} <span>${esc(c.type)}${c.nullable ? "?" : ""}</span></div>`
        ).join("") + `</div>`
      ).join("")
    ).join("");
    el.querySelectorAll(".tbl").forEach(t => t.addEventListener("click", e => {
      if (e.target.classList.contains("ddl")) return;
      t.parentElement.classList.toggle("open");
      const q = `SELECT * FROM ${qi(t.dataset.db)}.${qi(t.dataset.tbl)} LIMIT 50`;
      document.getElementById("sql").value = q;
      runQuery();
    }));
    el.querySelectorAll(".ddl").forEach(d => d.addEventListener("click", () => {
      document.getElementById("sql").value = `SHOW CREATE TABLE ${qi(d.dataset.db)}.${qi(d.dataset.tbl)}`;
      runQuery();
    }));
  } catch (e) { el.textContent = "schema error: " + e.message; }
}

async function runQuery() {
  const sql = document.getElementById("sql").value.trim();
  if (!sql || !selected) return;
  const err = document.getElementById("qerr");
  const table = document.getElementById("result");
  err.textContent = ""; table.innerHTML = "<tr><td>running…</td></tr>";
  table.classList.toggle("raw", /^\s*show\s+create/i.test(sql));
  try {
    const res = await api(`/v1/branches/${encodeURIComponent(selected)}/query`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sql }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.status);
    table.innerHTML =
      "<tr>" + data.columns.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>" +
      data.rows.map(r => "<tr>" + r.map(v =>
        v === null ? '<td class="null">NULL</td>' : `<td>${esc(v)}</td>`
      ).join("") + "</tr>").join("");
    if (!data.rows.length) table.innerHTML += `<tr><td colspan="${data.columns.length || 1}" class="null">0 rows</td></tr>`;
    if (data.truncated) table.innerHTML += `<tr><td colspan="${data.columns.length}" class="null">…truncated at 200 rows</td></tr>`;
  } catch (e) { err.textContent = e.message; table.innerHTML = ""; }
}

document.getElementById("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-name]");
  if (tr) openBranch(tr.dataset.name);
});
document.getElementById("run").addEventListener("click", runQuery);
document.getElementById("sql").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runQuery();
});

refresh();
setInterval(refresh, 5000);
</script>
