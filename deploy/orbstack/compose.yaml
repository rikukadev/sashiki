# macOS(OrbStack)で sashiki をフル VM 無しに動かす(#113 候補B / #140)。
#   1. ホストで:  ./deploy/orbstack/build.sh   # sashiki を linux にクロスビルド
#   2. docker compose -f deploy/orbstack/compose.yaml up --build
#   3. mysql -udev@pr-1 -pdev -h 127.0.0.1 -P 13306  # 未知ブランチは lazy create(3306 は 13306 に公開)
# privileged は loopback XFS(reflink)のマウントに必要。
services:
  sashiki:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    # PID 1 を tini(docker-init)にして、daemonize した mysqld を SIGKILL した後の
    # ゾンビを刈り取る。刈り取られないと socket lock の pid が生存扱いになり、reset の
    # 再起動が MY-010259 で失敗する(#140)。
    init: true
    ports:
      - "13306:3306"   # proxy(user@branch ルーティング)
      - "8080:8080"   # REST API / Web UI
    environment:
      XFS_SIZE_MB: "2048"   # 初回の mkfs にだけ効く(拡張は entrypoint.sh のコメント参照)
    volumes:
      # ブランチ・baseline(XFS イメージ)・state.db・config はすべてここ(#290)。
      # `docker compose down` では残り、`down -v` で消える。
      - sashiki-xfs:/xfs-store
volumes:
  sashiki-xfs:
