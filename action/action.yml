name: "sashiki branch"
description: "PR の open/reopen/synchronize/close に連動して sashiki の DB ブランチを管理する"
branding:
  icon: git-branch
  color: green

inputs:
  transport:
    description: "接続方式 (api | ssm)。ssm は SSM Run Command でインスタンス上の CLI を叩く(VPC 内 API に runner が届かない構成向け)"
    required: false
    default: "api"
  instance_id:
    description: "transport=ssm のときの対象 EC2 instance id"
    required: false
    default: ""
  action:
    description: "操作を明示する (create | delete | reset)。省略時は PR イベントから決める(ラベル駆動で reset したい場合などに使う)"
    required: false
    default: ""
  api_url:
    description: "sashikid の API URL (例: http://sashiki.internal:8080)。transport=api のとき必須"
    required: false
    default: ""
  token:
    description: "sashiki API トークン"
    required: false
    default: ""
  branch:
    description: "ブランチ名 (省略時: pr-<PR番号>)"
    required: false
    default: ""
  profile:
    description: "lifecycle profile (例: preview / ci / sandbox。省略時はサーバー既定)"
    required: false
    default: ""
  source:
    description: "provenance の source JSON (省略時は github_pr を自動生成)"
    required: false
    default: ""
  on_close:
    description: "PR close 時の動作 (delete | keep。keep は TTL 回収に任せる)"
    required: false
    default: "delete"
  comment:
    description: "PR に接続先をコメントする (true|false)"
    required: false
    default: "false"
  github_token:
    description: "コメント投稿用の GitHub トークン"
    required: false
    default: ${{ github.token }}

outputs:
  host:
    description: "接続ホスト"
    value: ${{ steps.branch.outputs.host }}
  port:
    description: "接続ポート"
    value: ${{ steps.branch.outputs.port }}
  user:
    description: "接続ユーザー (dev@<branch>)"
    value: ${{ steps.branch.outputs.user }}
  created:
    description: "新規作成なら true、既存なら false。transport: ssm では unknown"
    value: ${{ steps.branch.outputs.created }}

runs:
  using: composite
  steps:
    - id: branch
      shell: bash
      env:
        SASHIKI_TRANSPORT: ${{ inputs.transport }}
        SASHIKI_INSTANCE_ID: ${{ inputs.instance_id }}
        SASHIKI_ACTION: ${{ inputs.action }}
        SASHIKI_API_URL: ${{ inputs.api_url }}
        SASHIKI_API_TOKEN: ${{ inputs.token }}
        SASHIKI_BRANCH: ${{ inputs.branch != '' && inputs.branch || format('pr-{0}', github.event.pull_request.number) }}
        SASHIKI_EVENT: ${{ github.event.action }}
        SASHIKI_PROFILE: ${{ inputs.profile }}
        SASHIKI_SOURCE: ${{ inputs.source }}
        SASHIKI_ON_CLOSE: ${{ inputs.on_close }}
        SASHIKI_PR: ${{ github.event.pull_request.number }}
      run: |
        SASHIKI_OUTPUT="$GITHUB_OUTPUT" "${{ github.action_path }}/entrypoint.sh"

    - name: Comment connection info on PR
      if: inputs.comment == 'true' && github.event.action != 'closed' && steps.branch.outputs.host != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        HOST: ${{ steps.branch.outputs.host }}
        PORT: ${{ steps.branch.outputs.port }}
        DBUSER: ${{ steps.branch.outputs.user }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        marker="<!-- sashiki-action-comment -->"
        body="${marker}
        ## 🌿 sashiki DB ブランチ

        この PR の DB ブランチが利用できます:

        \`\`\`
        mysql -u${DBUSER} -h ${HOST} -P ${PORT}
        \`\`\`

        PR を閉じると自動で削除されます。"
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
          --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id" 2>/dev/null || true)
        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
        fi
